<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#f2f2f7">
  <title>QuoteKeeper</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- ===== LIST VIEW ===== -->
  <div id="view-list" class="view active">
    <header class="header">
      <h1>Quotes</h1>
      <div class="header-actions">
        <button id="btn-search" class="icon-btn" aria-label="Search">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        </button>
      </div>
    </header>

    <div id="search-bar" class="search-bar hidden">
      <input type="text" id="search-input" placeholder="Search quotes..." autocomplete="off">
    </div>

    <div id="quotes-list" class="quotes-list">
      <div id="empty-state" class="empty-state">
        <p class="empty-icon">""</p>
        <p>No quotes yet</p>
        <p class="empty-sub">Tap + to capture your first quote</p>
      </div>
    </div>

    <button id="btn-new" class="fab" aria-label="New Quote">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

  <!-- ===== EDITOR VIEW ===== -->
  <div id="view-editor" class="view">
    <header class="header editor-header">
      <button id="btn-back" class="text-btn">&larr; Quotes</button>
      <div class="header-actions">
        <button id="btn-delete" class="text-btn danger">Delete</button>
      </div>
    </header>

    <div class="editor-container">
      <!-- Source metadata banner -->
      <div id="source-banner" class="source-banner">
        <div class="source-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        </div>
        <div class="source-info">
          <span id="source-title" class="source-title">No media detected</span>
          <span id="source-artist" class="source-artist"></span>
          <span id="source-album" class="source-album"></span>
        </div>
        <button id="btn-refresh-source" class="icon-btn small" aria-label="Refresh source">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
        </button>
      </div>

      <!-- Quote text area -->
      <textarea id="quote-text" class="quote-textarea" placeholder="Type your quote here..."></textarea>

      <!-- Input controls bar -->
      <div class="input-controls">
        <button id="btn-voice" class="control-btn" aria-label="Dictate">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
          <span class="control-label">Dictate</span>
        </button>
        <button id="btn-record-audio" class="control-btn" aria-label="Record playing audio">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4" fill="currentColor"/></svg>
          <span class="control-label">Capture Audio</span>
        </button>
        <button id="btn-manual-source" class="control-btn" aria-label="Edit source manually">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          <span class="control-label">Edit Source</span>
        </button>
      </div>

      <!-- Voice recording indicator -->
      <div id="voice-indicator" class="voice-indicator hidden">
        <div class="pulse-ring"></div>
        <span id="voice-status">Listening...</span>
        <button id="btn-stop-voice" class="stop-btn">Stop</button>
      </div>

      <!-- Audio recording indicator -->
      <div id="audio-indicator" class="audio-indicator hidden">
        <div class="recording-dot"></div>
        <span id="audio-timer">00:00</span>
        <button id="btn-stop-audio" class="stop-btn">Stop & Transcribe</button>
      </div>

      <!-- Tags -->
      <div class="tags-section">
        <input type="text" id="tag-input" class="tag-input" placeholder="Add tag...">
        <div id="tags-list" class="tags-list"></div>
      </div>

      <!-- Timestamp -->
      <div id="quote-timestamp" class="quote-timestamp"></div>
    </div>
  </div>

  <!-- ===== SOURCE EDIT MODAL ===== -->
  <div id="modal-source" class="modal hidden">
    <div class="modal-content">
      <h3>Edit Source</h3>
      <label>Title / Episode
        <input type="text" id="modal-source-title" placeholder="e.g. Episode 42: Deep Work">
      </label>
      <label>Author / Host
        <input type="text" id="modal-source-artist" placeholder="e.g. Cal Newport">
      </label>
      <label>Show / Book
        <input type="text" id="modal-source-album" placeholder="e.g. Deep Questions Podcast">
      </label>
      <label>URL (optional)
        <input type="url" id="modal-source-url" placeholder="https://...">
      </label>
      <div class="modal-actions">
        <button id="modal-cancel" class="text-btn">Cancel</button>
        <button id="modal-save" class="text-btn primary">Save</button>
      </div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/media.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
